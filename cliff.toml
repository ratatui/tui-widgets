# git-cliff ~ default configuration file
# https://git-cliff.org/docs/configuration
#
# Lines starting with "#" are comments.
# Configuration options are organized into tables and keys.
# See documentation for more information on available options.

[changelog]
# changelog header
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
# template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{% if version -%}
{% if package -%}
## [{{ version | trim_start_matches(pat="v") }}](https://crates.io/crates/{{ package }}/{{ version | trim_start_matches(pat="v") }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% endif -%}
{% else -%}
## Unreleased
{% endif %}
{% set_global has_changes = false -%}
{% for group, commits in commits | group_by(attribute="group") -%}
{% if group != "Dependencies" and group != "Maintenance" -%}
{% for commit in commits -%}
{% set_global has_changes = true -%}
- {% if commit.scope %}*({{ commit.scope | trim_start_matches(pat="tui-") }})* {% endif %}\
{% if commit.breaking %}**Breaking:** {% elif group == "<!-- 1 -->Security" %}**Security:** {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first }}
{%- if commit.breaking_description %}
{{ commit.breaking_description | indent(prefix="  ", first=true, blank=true) }}
{%- endif %}
{%- for footer in commit.footers | default(value=[]) %}
{%- if footer.token == "Release-note" %}
{{ footer.value | indent(prefix="  ", first=true, blank=true) }}
{%- endif %}
{%- endfor %}
{% endfor -%}
{% endif -%}
{% endfor -%}
{% if not has_changes -%}
{% if commits | filter(attribute="group", value="Dependencies") | length > 0 -%}
Dependency updates.
{% else -%}
Maintenance updates.
{% endif -%}
{% endif -%}
"""
# Remove leading and trailing whitespace.
trim = true
# postprocessors
postprocessors = [
  { pattern = '<REPO>', replace = "https://github.com/ratatui/tui-widgets" }, # replace repository URL
  { pattern = ' +\n', replace = "\n" },
]

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = false
# process each line of a commit as an individual commit
split_commits = false
# regex for preprocessing the commit messages
commit_preprocessors = [
  # Escape literal bracket labels in historical subjects and bot names.
  { pattern = '\[(codex|bot)\]', replace = '\[${1}\]' },
  # Keep wrapped URLs in their footer instead of parsing the scheme as a new footer.
  { pattern = '\n(https?://\S+)', replace = " <${1}>" },
  # Squash-merge PR numbers belong to the subject; issue references stay issue links.
  { pattern = '^([^\n]+) \(#([0-9]+)\)', replace = "${1} ([#${2}](<REPO>/pull/${2}))" },
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))" },
  # Check spelling of the commit with https://github.com/crate-ci/typos
  # If the spelling is incorrect, it will be automatically fixed.
  #{ pattern = '.*', replace_command = 'typos --write-changes -' },
]
# regex for parsing and grouping commits
commit_parsers = [
  { message = '^\s*$', skip = true },
  # Explicit consumer-impact signals take precedence over maintenance filters.
  { message = '^[a-z]+(?:\([^)]*\))?!:', group = "<!-- 0 -->Breaking changes" },
  { footer = '^BREAKING[ -]CHANGE:', group = "<!-- 0 -->Breaking changes" },
  { message = '^fix\(security\):', group = "<!-- 1 -->Security" },
  { message = '^feat(?:\([^)]*\))?:', group = "<!-- 2 -->Features" },
  { message = '^fix(?:\([^)]*\))?:', group = "<!-- 3 -->Fixes" },
  { message = '^perf(?:\([^)]*\))?:', group = "<!-- 4 -->Performance" },
  { message = '^docs?(?:\([^)]*\))?:', group = "<!-- 5 -->Documentation" },
  { footer = '^Release-note:', group = "<!-- 6 -->Changed" },
  # Dependency PRs with consumer impact should use fix/feat or a Release-note footer.
  # Match both historical build(deps) and chore(deps) subjects.
  { message = '^(build|chore)\(deps[^)]*\):', group = "Dependencies" },
  { message = '^chore: update Cargo\.(toml|lock) dependencies', group = "Dependencies" },
  { message = '^chore\(tui-[^)]*\): release ', group = "Dependencies" },
  { message = '^(ci|chore|style|test|refactor)(?:\([^)]*\))?:', group = "Maintenance" },
  { message = '^revert(?:\([^)]*\))?:', group = "<!-- 7 -->Reverted" },
  { message = ".*", group = "<!-- 6 -->Changed" },
]
# protect breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = true
# filter out the commits that are not matched by commit parsers
filter_commits = false
# regex for matching git tags
# tag_pattern = "v[0-9].*"
# regex for skipping tags
# skip_tags = ""
# regex for ignoring tags
# ignore_tags = ""
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest/newest order
sort_commits = "oldest"
# limit the number of commits included in the changelog.
# limit_commits = 42
